          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
function loadChart(symbol) {
  const container = document.getElementById('tradingview_chart');
  // Clear previous widget
  container.innerHTML = '';
  new TradingView.widget({
    autosize: true,
    symbol: symbol,
    interval: 'D',
    timezone: 'Etc/UTC',
    theme: 'dark',
    style: '1',
    locale: 'en',
    enable_publishing: false,
    backgroundColor: 'rgba(11, 15, 25, 1)',
    gridColor: 'rgba(31, 41, 55, 1)',
    hide_top_toolbar: false,
    hide_legend: false,
    save_image: false,
    container_id: 'tradingview_chart'
  });
}

// Initial load
loadChart('NASDAQ:AAPL');

// Set up search button handler
document.getElementById('stock_button').addEventListener('click', function() {
  const sym = document.getElementById('stock_input').value.trim();
  if (sym) {
    const loader = document.getElementById('loader');
    loader.classList.remove('hidden');
    loadChart(sym);
    // hide loader after a short delay (widget loads quickly)
    setTimeout(() => loader.classList.add('hidden'), 800);
  }
});
          </script>
